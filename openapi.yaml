openapi: 3.0.3
info:
  title: Tasks API
  version: 1.0.0
servers:
  - url: http://localhost:4010
paths:
  /tasks:
    get:
      operationId: listTasks
      summary: List tasks
      description: Returns all tasks as a JSON array. The array is empty when no tasks exist.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "429":
          description: Too many requests. Retry after a delay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createTask
      summary: Create a task
      description: Creates a task from the supplied name and returns the created task, including its generated id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTask"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: The request body is malformed or is missing the required `name`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{taskId}:
    get:
      operationId: getTask
      summary: Get a task
      description: Returns a single task identified by its id.
      parameters:
        - name: taskId
          in: path
          required: true
          description: The unique identifier of the task.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: No task exists with the supplied `taskId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTask
      summary: Delete a task
      description: Permanently deletes the task identified by its id. Returns no content on success.
      parameters:
        - name: taskId
          in: path
          required: true
          description: The unique identifier of the task.
          schema:
            type: string
      responses:
        "204":
          description: The task was deleted. No content is returned.
        "404":
          description: No task exists with the supplied `taskId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    NewTask:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        done:
          type: boolean
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable description of the error.
